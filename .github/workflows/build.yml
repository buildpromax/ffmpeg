name: 编译 FFmpeg musl 静态版本

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: '构建模式'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - minimal
      target_arch:
        description: '目标架构 (all=全部并行编译)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - x86_64
          - aarch64
          - armv7
      toolchain_source:
        description: '工具链来源'
        required: true
        default: 'github-release'
        type: choice
        options:
          - github-release
          - build
      create_release:
        description: '是否创建 Release'
        required: true
        default: false
        type: boolean
      release_tag:
        description: 'Release Tag (留空则使用当前分支名)'
        required: false
        default: ''
        type: string

env:
  FFMPEG_VERSION: "n8.1.2"
  X264_TAG: "stable"
  X265_TAG: "4.1"
  OPUS_VERSION: "1.5.2"
  VPX_TAG: "v1.14.1"
  FDK_TAG: "v2.0.3"
  LAME_VERSION: "3.100"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          case "${{ github.event.inputs.target_arch }}" in
            all)
              echo 'matrix={"include":[{"arch":"x86_64","musl_target":"x86_64-linux-musl","ffmpeg_arch":"x86_64","cpu":"x86-64","enable_x86asm":"true","prebuilt_filename":"x86_64-x86_64-linux-musl.tar.xz","can_run_native":"true","vpx_target":"x86_64-linux-gcc"},{"arch":"aarch64","musl_target":"aarch64-linux-musl","ffmpeg_arch":"aarch64","cpu":"armv8-a","enable_x86asm":"false","prebuilt_filename":"x86_64-aarch64-linux-musl.tar.xz","can_run_native":"false","vpx_target":"arm64-linux-gcc"},{"arch":"armv7","musl_target":"armv7l-linux-musleabihf","ffmpeg_arch":"arm","cpu":"armv7-a","enable_x86asm":"false","prebuilt_filename":"x86_64-armv7l-linux-musleabihf.tar.xz","can_run_native":"false","vpx_target":"armv7-linux-gcc"}]}' >> $GITHUB_OUTPUT
              ;;
            x86_64)
              echo 'matrix={"include":[{"arch":"x86_64","musl_target":"x86_64-linux-musl","ffmpeg_arch":"x86_64","cpu":"x86-64","enable_x86asm":"true","prebuilt_filename":"x86_64-x86_64-linux-musl.tar.xz","can_run_native":"true","vpx_target":"x86_64-linux-gcc"}]}' >> $GITHUB_OUTPUT
              ;;
            aarch64)
              echo 'matrix={"include":[{"arch":"aarch64","musl_target":"aarch64-linux-musl","ffmpeg_arch":"aarch64","cpu":"armv8-a","enable_x86asm":"false","prebuilt_filename":"x86_64-aarch64-linux-musl.tar.xz","can_run_native":"false","vpx_target":"arm64-linux-gcc"}]}' >> $GITHUB_OUTPUT
              ;;
            armv7)
              echo 'matrix={"include":[{"arch":"armv7","musl_target":"armv7l-linux-musleabihf","ffmpeg_arch":"arm","cpu":"armv7-a","enable_x86asm":"false","prebuilt_filename":"x86_64-armv7l-linux-musleabihf.tar.xz","can_run_native":"false","vpx_target":"armv7-linux-gcc"}]}' >> $GITHUB_OUTPUT
              ;;
          esac

  build:
    name: 编译 ${{ github.event.inputs.flavor }} (${{ matrix.arch }})
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装基础依赖
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bison flex texinfo gperf patch \
            curl git nasm yasm cmake ninja-build pkg-config \
            autoconf automake libtool python3 xz-utils \
            qemu-user-static binfmt-support

      - name: 缓存工具链与源码
        uses: actions/cache@v6
        with:
          path: |
            toolchain
            ffmpeg-src
            ext-libs
          key: ${{ runner.os }}-musl-${{ matrix.arch }}-${{ github.event.inputs.flavor }}-${{ github.event.inputs.toolchain_source }}-ffmpeg-${{ env.FFMPEG_VERSION }}-v12
          restore-keys: |
            ${{ runner.os }}-musl-${{ matrix.arch }}-${{ github.event.inputs.flavor }}-

      - name: 从 GitHub Release 下载预编译工具链
        if: github.event.inputs.toolchain_source == 'github-release'
        run: |
          set -euo pipefail
          mkdir -p toolchain
          cd toolchain

          MARKER="downloaded-${{ matrix.musl_target }}.marker"
          if [ -f "$MARKER" ]; then
            echo "使用缓存的工具链"
          else
            echo "从 GitHub Release 下载预编译工具链..."
            URL="https://github.com/userdocs/qbt-musl-cross-make/releases/latest/download/${{ matrix.prebuilt_filename }}"
            echo "下载地址: $URL"
            curl -fSL "$URL" -o toolchain.tar.xz
            ls -lh toolchain.tar.xz
            tar -xf toolchain.tar.xz
            rm toolchain.tar.xz
            touch "$MARKER"
            echo "✓ 下载并解压成功"
          fi

          GCC_PATH=$(find "$PWD" -name "${{ matrix.musl_target }}-gcc" -type f | head -1)
          if [ -z "$GCC_PATH" ]; then
            echo "::error::找不到 ${{ matrix.musl_target }}-gcc!"
            find . -maxdepth 3 -type d | head -30
            exit 1
          fi
          TOOLCHAIN_BIN=$(dirname "$GCC_PATH")
          echo "TOOLCHAIN_BIN=$TOOLCHAIN_BIN" >> $GITHUB_ENV
          echo "TOOLCHAIN_ROOT=$(dirname "$TOOLCHAIN_BIN")" >> $GITHUB_ENV
          echo "工具链 bin 目录: $TOOLCHAIN_BIN"
          "$TOOLCHAIN_BIN/${{ matrix.musl_target }}-gcc" --version | head -1

      - name: 从源码编译工具链
        if: github.event.inputs.toolchain_source == 'build'
        run: |
          set -euo pipefail
          if [ ! -d "musl-cross-make" ]; then
            git clone --depth 1 https://github.com/richfelker/musl-cross-make.git
          fi
          cd musl-cross-make
          cat > config.mak <<EOF
          TARGET = ${{ matrix.musl_target }}
          OUTPUT = \\$PWD/../toolchain
          COMMON_CONFIG += --enable-static --disable-shared
          GCC_CONFIG += --disable-gold --disable-lto
          MUSL_CONFIG += --enable-optimize
          EOF
          if [ ! -f "../toolchain/bin/${{ matrix.musl_target }}-gcc" ]; then
            echo "正在编译 musl 工具链 (${{ matrix.musl_target }})..."
            make -j$(nproc) 2>&1 | tail -100
            make install
          else
            echo "使用缓存的工具链"
          fi
          TOOLCHAIN_BIN=$PWD/../toolchain/bin
          echo "TOOLCHAIN_BIN=$TOOLCHAIN_BIN" >> $GITHUB_ENV
          echo "TOOLCHAIN_ROOT=$PWD/../toolchain" >> $GITHUB_ENV
          "$TOOLCHAIN_BIN/${{ matrix.musl_target }}-gcc" --version | head -1

      - name: 克隆 FFmpeg
        run: |
          set -euo pipefail
          if [ ! -d "ffmpeg-src" ]; then
            git clone --depth 1 --branch release/8.1 \
              https://git.ffmpeg.org/ffmpeg.git ffmpeg-src
            cd ffmpeg-src
            git fetch --depth 1 origin tag ${{ env.FFMPEG_VERSION }}
            git checkout ${{ env.FFMPEG_VERSION }}
          else
            cd ffmpeg-src
          fi
          git log -1 --oneline

      - name: 编译外部依赖库
        if: github.event.inputs.flavor == 'full'
        run: |
          set -euo pipefail
          export PATH="$TOOLCHAIN_BIN:$PATH"
          export CC=${{ matrix.musl_target }}-gcc
          export CXX=${{ matrix.musl_target }}-g++
          export AR=${{ matrix.musl_target }}-ar
          export RANLIB=${{ matrix.musl_target }}-ranlib
          export STRIP=${{ matrix.musl_target }}-strip
          export NM=${{ matrix.musl_target }}-nm
          export LD=${{ matrix.musl_target }}-ld
          export PREFIX=$PWD/ext-libs
          mkdir -p $PREFIX

          # 生成 CMake toolchain file（供 x265 使用）
          cat > /tmp/toolchain.cmake <<EOF
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR ${{ matrix.arch }})
          set(CMAKE_C_COMPILER $TOOLCHAIN_BIN/$CC)
          set(CMAKE_CXX_COMPILER $TOOLCHAIN_BIN/$CXX)
          set(CMAKE_AR $TOOLCHAIN_BIN/$AR)
          set(CMAKE_RANLIB $TOOLCHAIN_BIN/$RANLIB)
          set(CMAKE_STRIP $TOOLCHAIN_BIN/$STRIP)
          set(CMAKE_NM $TOOLCHAIN_BIN/$NM)
          set(CMAKE_LINKER $TOOLCHAIN_BIN/$LD)
          set(CMAKE_FIND_ROOT_PATH $TOOLCHAIN_ROOT)
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          EOF

          # x264
          if [ ! -f "$PREFIX/lib/libx264.a" ]; then
            echo "=== 编译 x264 ==="
            if [ ! -d x264 ]; then
              git clone --depth 1 --branch ${{ env.X264_TAG }} https://code.videolan.org/videolan/x264.git
            fi
            cd x264
            ./configure --prefix=$PREFIX --host=${{ matrix.musl_target }} \
              --cross-prefix=${{ matrix.musl_target }}- \
              --enable-static --disable-opencl --enable-pic \
              --extra-cflags="-static" --extra-ldflags="-static"
            make -j$(nproc)
            make install
            cd ..
          fi

          # x265
          if [ ! -f "$PREFIX/lib/libx265.a" ]; then
            echo "=== 编译 x265 ==="
            if [ ! -d x265 ]; then
              git clone --depth 1 --branch ${{ env.X265_TAG }} https://bitbucket.org/multicoreware/x265_git.git x265
            fi
            cd x265/build/linux
            cmake -DCMAKE_TOOLCHAIN_FILE=/tmp/toolchain.cmake \
                  -DCMAKE_INSTALL_PREFIX=$PREFIX \
                  -DENABLE_SHARED=OFF -DENABLE_CLI=OFF \
                  -DCMAKE_BUILD_TYPE=Release \
                  ../../source 2>&1 | tail -10
            make -j$(nproc)
            make install
            cd ../../..
          fi

          # opus
          if [ ! -f "$PREFIX/lib/libopus.a" ]; then
            echo "=== 编译 opus ==="
            if [ ! -d opus ]; then
              curl -sL https://downloads.xiph.org/releases/opus/opus-${{ env.OPUS_VERSION }}.tar.gz | tar -xz
              mv opus-${{ env.OPUS_VERSION }} opus
            fi
            cd opus
            ./configure --prefix=$PREFIX --host=${{ matrix.musl_target }} \
              --enable-static --disable-shared --disable-doc \
              CFLAGS="-static -Os" LDFLAGS="-static"
            make -j$(nproc)
            make install
            cd ..
          fi

          # vpx（libvpx 用环境变量 CFLAGS/LDFLAGS，不支持 --extra-cflags/--extra-ldflags）
          if [ ! -f "$PREFIX/lib/libvpx.a" ]; then
            echo "=== 编译 vpx ==="
            if [ ! -d libvpx ]; then
              git clone --depth 1 --branch ${{ env.VPX_TAG }} https://chromium.googlesource.com/webm/libvpx.git
            fi
            cd libvpx
            CROSS=${{ matrix.musl_target }}- \
            CFLAGS="-static" LDFLAGS="-static" \
              ./configure --prefix=$PREFIX \
                --target=${{ matrix.vpx_target }} \
                --disable-shared --enable-static \
                --disable-unit-tests --disable-examples \
                --disable-docs --enable-vp9-highbitdepth --enable-pic
            make -j$(nproc)
            make install
            cd ..
          fi

          # fdk-aac
          if [ ! -f "$PREFIX/lib/libfdk-aac.a" ]; then
            echo "=== 编译 fdk-aac ==="
            if [ ! -d fdk-aac ]; then
              git clone --depth 1 --branch ${{ env.FDK_TAG }} https://github.com/mstorsjo/fdk-aac.git
            fi
            cd fdk-aac
            autoreconf -fiv
            ./configure --prefix=$PREFIX --host=${{ matrix.musl_target }} \
              --enable-static --disable-shared \
              CFLAGS="-static -Os" LDFLAGS="-static"
            make -j$(nproc)
            make install
            cd ..
          fi

          # lame
          if [ ! -f "$PREFIX/lib/libmp3lame.a" ]; then
            echo "=== 编译 lame ==="
            if [ ! -d lame ]; then
              curl -sL https://downloads.sourceforge.net/project/lame/lame/${{ env.LAME_VERSION }}/lame-${{ env.LAME_VERSION }}.tar.gz | tar -xz
              mv lame-${{ env.LAME_VERSION }} lame
            fi
            cd lame
            ./configure --prefix=$PREFIX --host=${{ matrix.musl_target }} \
              --enable-static --disable-shared \
              CFLAGS="-static -Os" LDFLAGS="-static"
            make -j$(nproc)
            make install
            cd ..
          fi

          echo "=== 外部库编译完成 ==="
          ls -lh $PREFIX/lib/*.a 2>/dev/null || true

      - name: 设置 pkg-config 路径
        if: github.event.inputs.flavor == 'full'
        run: |
          set -euo pipefail
          echo "PKG_CONFIG_PATH=$PWD/ext-libs/lib/pkgconfig" >> $GITHUB_ENV
          echo "PKG_CONFIG_LIBDIR=$PWD/ext-libs/lib/pkgconfig" >> $GITHUB_ENV
          ls -la $PWD/ext-libs/lib/pkgconfig/ 2>/dev/null || echo "pkgconfig 目录不存在或为空"

      - name: 配置 FFmpeg
        working-directory: ffmpeg-src
        run: |
          set -euo pipefail
          export PATH="$TOOLCHAIN_BIN:$PATH"
          export CC=${{ matrix.musl_target }}-gcc
          export CXX=${{ matrix.musl_target }}-g++
          export AR=${{ matrix.musl_target }}-ar
          export NM=${{ matrix.musl_target }}-nm
          export STRIP=${{ matrix.musl_target }}-strip

          BASE_FLAGS=(
            "--prefix=${GITHUB_WORKSPACE}/ffmpeg-out"
            "--enable-cross-compile"
            "--cross-prefix=${{ matrix.musl_target }}-"
            "--pkg-config=pkg-config"
            "--sysroot=${TOOLCHAIN_ROOT}"
            "--pkg-config-flags=--static"
            "--extra-cflags=-static -Os"
            "--extra-ldflags=-static -Wl,-s"
            "--extra-libs=-lpthread -lm"
            "--enable-static"
            "--disable-shared"
            "--enable-pic"
            "--enable-pthreads"
            "--enable-runtime-cpudetect"
            "--arch=${{ matrix.ffmpeg_arch }}"
            "--cpu=${{ matrix.cpu }}"
            "--target-os=linux"
            "--disable-doc"
            "--disable-ffplay"
            "--disable-decoder=magicyuv"
          )

          if [ "${{ matrix.enable_x86asm }}" = "true" ]; then
            BASE_FLAGS+=("--enable-x86asm")
          else
            BASE_FLAGS+=("--disable-x86asm" "--enable-neon" "--enable-vfp")
          fi

          if [ "${{ github.event.inputs.flavor }}" = "full" ]; then
            FLAVOR_FLAGS=(
              "--enable-gpl"
              "--enable-version3"
              "--enable-libx264"
              "--enable-libx265"
              "--enable-libvpx"
              "--enable-libopus"
              "--enable-libmp3lame"
              "--enable-libfdk-aac"
              "--extra-cflags=-I${GITHUB_WORKSPACE}/ext-libs/include"
              "--extra-ldflags=-L${GITHUB_WORKSPACE}/ext-libs/lib"
              "--enable-nonfree"
            )
            echo "::warning::full 模式包含 nonfree fdk-aac"
          else
            FLAVOR_FLAGS=("--enable-gpl" "--disable-nonfree")
          fi

          ./configure "${BASE_FLAGS[@]}" "${FLAVOR_FLAGS[@]}"

      - name: 编译 FFmpeg
        working-directory: ffmpeg-src
        run: |
          set -euo pipefail
          export PATH="$TOOLCHAIN_BIN:$PATH"
          make -j$(nproc) 2>&1 | tail -30
          make install

      - name: 验证静态二进制
        run: |
          set -euo pipefail
          cd ${GITHUB_WORKSPACE}/ffmpeg-out/bin
          file ffmpeg

          if command -v readelf >/dev/null 2>&1; then
            INTERP=$(readelf -l ffmpeg 2>/dev/null | grep "REQUESTING PROGRAM INTERPRETER" | sed 's/.*REQUESTING PROGRAM INTERPRETER:\(.*\)\]/\1/' | tr -d ' ' || true)
            if [ -n "$INTERP" ]; then
              echo "::error::发现动态链接器: $INTERP"
              exit 1
            else
              echo "✓ readelf 确认无动态链接器 (纯静态，可在 Android 运行)"
            fi
          fi

          if command -v ldd >/dev/null 2>&1; then
            LDD_OUT=$(ldd ffmpeg 2>&1) || true
            if echo "$LDD_OUT" | grep -qE "not a dynamic executable|statically linked"; then
              echo "✓ ldd 确认纯静态链接"
            elif echo "$LDD_OUT" | grep -q "=>"; then
              echo "::error::发现动态依赖!"
              echo "$LDD_OUT"
              exit 1
            else
              echo "::warning::ldd 输出异常: $LDD_OUT"
            fi
          fi

          ls -lh ffmpeg ffprobe

          if [ "${{ matrix.can_run_native }}" = "true" ]; then
            echo "=== 同架构执行测试 ==="
            ./ffmpeg -version 2>&1 | head -3
            ./ffprobe -version 2>&1 | head -3
            ./ffmpeg -f lavfi -i "testsrc=duration=1:size=320x240:rate=10" \
                     -f lavfi -i "sine=frequency=440:duration=1" \
                     -c:v mpeg4 -c:a aac /tmp/test.mp4 -y 2>&1 | tail -5
            ls -lh /tmp/test.mp4
            ./ffprobe /tmp/test.mp4 2>&1 | head -10
          else
            echo "=== 跨架构执行测试 (QEMU) ==="
            QEMU_ARCH="${{ matrix.arch }}"
            if [ "$QEMU_ARCH" = "armv7" ]; then QEMU_ARCH="arm"; fi
            qemu-${QEMU_ARCH}-static ./ffmpeg -version 2>&1 | head -3
            qemu-${QEMU_ARCH}-static ./ffprobe -version 2>&1 | head -3
            qemu-${QEMU_ARCH}-static ./ffmpeg -f lavfi -i "testsrc=duration=1:size=320x240:rate=10" \
                     -f lavfi -i "sine=frequency=440:duration=1" \
                     -c:v mpeg4 -c:a aac /tmp/test.mp4 -y 2>&1 | tail -5
            ls -lh /tmp/test.mp4
            qemu-${QEMU_ARCH}-static ./ffprobe /tmp/test.mp4 2>&1 | head -10
          fi

      - name: 打包
        run: |
          set -euo pipefail
          cd ${GITHUB_WORKSPACE}/ffmpeg-out/bin
          tar czf ffmpeg-${{ github.event.inputs.flavor }}-${{ matrix.arch }}-musl.tar.gz ffmpeg ffprobe
          ls -lh ffmpeg-${{ github.event.inputs.flavor }}-${{ matrix.arch }}-musl.tar.gz

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-${{ github.event.inputs.flavor }}-${{ matrix.arch }}-musl
          path: ffmpeg-out/bin/ffmpeg-${{ github.event.inputs.flavor }}-${{ matrix.arch }}-musl.tar.gz
          archive: false
          retention-days: 30

  release:
    name: 创建 Release
    needs: build
    if: github.event.inputs.create_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      actions: read
    steps:
      - name: 下载所有产物
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: ffmpeg-*
          merge-multiple: true

      - name: 创建 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: artifacts/**/*.tar.gz
          generate_release_notes: true
