name: FFmpeg 发布修复

# 补救工具: 从已完成的构建 run 下载产物, 发布/覆盖到指定 Release tag
# 场景: 构建全绿但发布环节异常(产物滞留 artifacts), 无需重新编译

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: '来源构建 run id (产物所在 run)'
        required: true
        type: string
      tag:
        description: '目标 Release tag (latest / ffmpeg-9.0.2 / ...)'
        required: true
        type: string
      title:
        description: 'Release 标题 (留空则用 tag)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  republish:
    name: 重发 ${{ inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: 下载源 run 的全部产物
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          pattern: ffmpeg-*
          merge-multiple: true
          path: rel

      - name: 发布/覆盖 Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
        run: |
          set -e
          cd rel
          ls -lh
          # 同名产物去重: 多次构建同名文件只保留最新一份
          sha256sum ./* > SHA256SUMS.txt
          title="${TITLE:-$TAG}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 清空旧 assets 后全量重传(--clobber 对改名文件无能为力)
            gh api "repos/${GH_REPO}/releases/tags/$TAG" --jq '.assets[].id' \
              | while read -r id; do
                  gh api -X DELETE "repos/${GH_REPO}/releases/assets/$id"
                done
            gh release upload "$TAG" ./*
          else
            gh release create "$TAG" ./* --title "$title" \
              --notes "FFmpeg 构建产物 (run ${GITHUB_RUN_ID})"
          fi
          # BtbN 风格正文: 按平台分组的下载表写入 release note
          python3 "$GITHUB_WORKSPACE/scripts/generate-release-note.py" \
            --tag "$TAG" --header "$title" \
            --time "$(date -u '+%Y-%m-%d %H:%M UTC')" --apply
          echo "发布完成: $TAG ($(ls ./* | wc -l) 个文件)"
